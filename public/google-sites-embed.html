cument.getElementById('startBtn');\n\nconst GROUND_Y = canvas.height - 30;\n\nlet dino = {\n  x: 50,\n  y: GROUND_Y - 40,\n  w: 24,\n  h: 40,\n  vy: 0,\n  jumpStrength: -11,\n  gravity: 0.6,\n  isGrounded: true,\n  isDucking: false\n};\n\nlet obstacles = [];\nlet clouds = [];\nlet distance = 0;\nlet baseSpeed = 5;\nlet currentSpeed = baseSpeed;\nlet isPlaying = false;\nlet frameCount = 0;\nlet bestDistance = parseInt(localStorage.getItem('unblocked_runner_best') || '0', 10);\nbestDistEl.textContent = bestDistance;\n\nfunction resetGame() {\n  dino.y = GROUND_Y - 40;\n  dino.h = 40;\n  dino.vy = 0;\n  dino.isGrounded = true;\n  dino.isDucking = false;\n  obstacles = [];\n  clouds = [\n    { x: 100, y: 30, w: 50 },\n    { x: 320, y: 50, w: 60 },\n    { x: 480, y: 25, w: 40 }\n  ];\n  distance = 0;\n  currentSpeed = baseSpeed;\n  frameCount = 0;\n}\n\nfunction spawnObstacle() {\n  const isBird = Math.random() \u003c 0.25 && distance > 200;\n  if (isBird) {\n    obstacles.push({\n      type: 'bird',\n      x: canvas.width,\n      y: GROUND_Y - 45 - (Math.random() > 0.5 ? 20 : 0),\n      w: 26,\n      h: 18\n    });\n  } else {\n    const isDouble = Math.random() \u003c 0.3;\n    obstacles.push({\n      type: 'cactus',\n      x: canvas.width,\n      y: GROUND_Y - 36,\n      w: isDouble ? 28 : 16,\n      h: 36\n    });\n  }\n}\n\nfunction jump() {\n  if (dino.isGrounded && !dino.isDucking) {\n    dino.vy = dino.jumpStrength;\n    dino.isGrounded = false;\n  }\n}\n\nfunction duck(active) {\n  if (active) {\n    if (!dino.isDucking) {\n      dino.isDucking = true;\n      dino.h = 24;\n      if (dino.isGrounded) {\n        dino.y = GROUND_Y - 24;\n      }\n    }\n  } else {\n    if (dino.isDucking) {\n      dino.isDucking = false;\n      dino.h = 40;\n      if (dino.isGrounded) {\n        dino.y = GROUND_Y - 40;\n      }\n    }\n  }\n}\n\nfunction startGame() {\n  resetGame();\n  overlay.classList.add('hidden');\n  isPlaying = true;\n  requestAnimationFrame(gameLoop);\n}\n\nfunction gameOver() {\n  isPlaying = false;\n  if (distance > bestDistance) {\n    bestDistance = distance;\n    bestDistEl.textContent = bestDistance;\n    localStorage.setItem('unblocked_runner_best', bestDistance);\n  }\n  overlay.querySelector('h2').textContent = 'GAME OVER';\n  overlay.querySelector('p').textContent = `Distance: ${distance}m | Record: ${bestDistance}m`;\n  startBtn.textContent = 'Run Again';\n  overlay.classList.remove('hidden');\n}\n\nfunction update() {\n  frameCount++;\n  distance += 1;\n  distEl.textContent = distance;\n\n  // Speed scaling\n  currentSpeed = baseSpeed + Math.min(6, Math.floor(distance / 250) * 0.5);\n  speedEl.textContent = (currentSpeed / baseSpeed).toFixed(1);\n\n  // Physics\n  dino.vy += dino.gravity;\n  dino.y += dino.vy;\n\n  const currentHeight = dino.isDucking ? 24 : 40;\n  if (dino.y >= GROUND_Y - currentHeight) {\n    dino.y = GROUND_Y - currentHeight;\n    dino.vy = 0;\n    dino.isGrounded = true;\n  }\n\n  // Clouds\n  clouds.forEach(c => {\n    c.x -= currentSpeed * 0.2;\n    if (c.x + c.w \u003c 0) {\n      c.x = canvas.width + Math.random() * 80;\n      c.y = 20 + Math.random() * 40;\n    }\n  });\n\n  // Obstacles spawning\n  const minInterval = Math.max(50, 110 - Math.floor(distance / 300) * 5);\n  if (frameCount % minInterval === 0 && Math.random() > 0.2) {\n    spawnObstacle();\n  }\n\n  // Obstacle movement & collisions\n  for (let i = 0; i \u003c obstacles.length; i++) {\n    const obs = obstacles[i];\n    obs.x -= currentSpeed;\n\n    // Collision box check\n    const dBox = {\n      x: dino.x + 3,\n      y: dino.y + 3,\n      w: dino.w - 6,\n      h: dino.h - 6\n    };\n\n    if (\n      dBox.x \u003c obs.x + obs.w &&\n      dBox.x + dBox.w > obs.x &&\n      dBox.y \u003c obs.y + obs.h &&\n      dBox.y + dBox.h > obs.y\n    ) {\n      gameOver();\n      return;\n    }\n  }\n\n  obstacles = obstacles.filter(obs => obs.x + obs.w > 0);\n}\n\nfunction draw() {\n  // Clear\n  ctx.fillStyle = '#0f172a';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n\n  // Ground line\n  ctx.strokeStyle = '#334155';\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(0, GROUND_Y);\n  ctx.lineTo(canvas.width, GROUND_Y);\n  ctx.stroke();\n\n  // Clouds\n  ctx.fillStyle = '#1e293b';\n  clouds.forEach(c => {\n    ctx.beginPath();\n    ctx.roundRect(c.x, c.y, c.w, 14, 7);\n    ctx.fill();\n  });\n\n  // Dino\n  ctx.fillStyle = '#10b981';\n  ctx.fillRect(dino.x, dino.y, dino.w, dino.h);\n  // Dino eye\n  ctx.fillStyle = '#0f172a';\n  ctx.fillRect(dino.x + (dino.isDucking ? 16 : 14), dino.y + 6, 4, 4);\n\n  // Obstacles\n  obstacles.forEach(obs => {\n    if (obs.type === 'bird') {\n      ctx.fillStyle = '#f43f5e';\n      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);\n      ctx.fillStyle = '#ffffff';\n      ctx.fillRect(obs.x + 4, obs.y + 4, 4, 4);\n    } else {\n      ctx.fillStyle = '#eab308';\n      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);\n      // Cactus arms\n      ctx.fillRect(obs.x - 3, obs.y + 8, 4, 10);\n      ctx.fillRect(obs.x + obs.w - 1, obs.y + 12, 4, 10);\n    }\n  });\n}\n\nfunction gameLoop() {\n  if (!isPlaying) return;\n  update();\n  draw();\n  requestAnimationFrame(gameLoop);\n}\n\nwindow.addEventListener('keydown', e => {\n  if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) {\n    e.preventDefault();\n  }\n  if (!isPlaying && (e.key === ' ' || e.key === 'Enter')) {\n    startGame();\n    return;\n  }\n  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {\n    jump();\n  } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {\n    duck(true);\n  }\n});\n\nwindow.addEventListener('keyup', e => {\n  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {\n    duck(false);\n  }\n});\n\n// Mobile touch controls: tap to jump, swipe down to duck\nlet runnerTouchY = 0;\ncanvas.addEventListener('touchstart', e => {\n  if (e.touches.length > 0) {\n    runnerTouchY = e.touches[0].clientY;\n  }\n  if (!isPlaying) {\n    startGame();\n    return;\n  }\n  jump();\n  e.preventDefault();\n}, { passive: false });\n\ncanvas.addEventListener('touchmove', e => {\n  if (!isPlaying) return;\n  if (e.touches.length > 0) {\n    const dy = e.touches[0].clientY - runnerTouchY;\n    if (dy > 30) {\n      duck(true);\n    }\n  }\n  e.preventDefault();\n}, { passive: false });\n\ncanvas.addEventListener('touchend', e => {\n  duck(false);\n  e.preventDefault();\n}, { passive: false });\n\n// Mobile Gamepad PostMessage Listener\nwindow.addEventListener('message', e => {\n  if (e.data && e.data.type === 'arcade-key') {\n    const key = e.data.key;\n    const isDown = e.data.action === 'keydown';\n    if (isDown) {\n      if (!isPlaying && (key === ' ' || key === 'Enter' || key === 'Start')) {\n        startGame();\n        return;\n      }\n      if (key === ' ' || key === 'ArrowUp' || key === 'w' || key === 'W' || key === 'Jump') {\n        jump();\n      } else if (key === 'ArrowDown' || key === 's' || key === 'S' || key === 'Duck') {\n        duck(true);\n      }\n    } else {\n      if (key === 'ArrowDown' || key === 's' || key === 'S' || key === 'Duck') {\n        duck(false);\n      }\n    }\n  }\n});\n\nstartBtn.addEventListener('click', startGame);\ndraw();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","space-invaders":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>Space Defenders\u003c/title>\n  \u003cstyle>\n* {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n  user-select: none;\n}\n\nbody {\n  background: #090d16;\n  color: #f8fafc;\n  font-family: 'Courier New', Courier, monospace, system-ui;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 100vh;\n  overflow: hidden;\n}\n\n.space-container {\n  background: #1e293b;\n  padding: 16px;\n  border-radius: 12px;\n  border: 1px solid #334155;\n  box-shadow: 0 20px 30px rgba(0,0,0,0.5);\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.hud {\n  display: flex;\n  justify-content: space-between;\n  font-size: 13px;\n  font-weight: bold;\n  color: #94a3b8;\n}\n\n.hud span {\n  color: #38bdf8;\n}\n\n#lives {\n  color: #f43f5e;\n}\n\n.canvas-wrapper {\n  position: relative;\n  background: #020617;\n  border: 2px solid #38bdf8;\n  border-radius: 8px;\n  overflow: hidden;\n}\n\ncanvas {\n  display: block;\n}\n\n.overlay {\n  position: absolute;\n  inset: 0;\n  background: rgba(2, 6, 23, 0.9);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 12px;\n}\n\n.overlay.hidden {\n  display: none;\n}\n\n.overlay h2 {\n  font-size: 26px;\n  color: #38bdf8;\n  letter-spacing: 2px;\n}\n\n.overlay p {\n  color: #94a3b8;\n  font-size: 13px;\n}\n\nbutton {\n  background: #38bdf8;\n  color: #020617;\n  border: none;\n  padding: 10px 24px;\n  font-size: 15px;\n  font-weight: 800;\n  font-family: inherit;\n  border-radius: 6px;\n  cursor: pointer;\n}\n\nbutton:hover {\n  background: #7dd3fc;\n}\n\n.hint {\n  font-size: 11px;\n  color: #64748b;\n  text-align: center;\n}\n\n.hint span {\n  background: #334155;\n  color: #f1f5f9;\n  padding: 2px 5px;\n  border-radius: 4px;\n}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"space-container\">\n    \u003cdiv class=\"hud\">\n      \u003cdiv>SCORE: \u003cspan id=\"score\">0\u003c/span>\u003c/div>\n      \u003cdiv>LIVES: \u003cspan id=\"lives\">&hearts; &hearts; &hearts;\u003c/span>\u003c/div>\n      \u003cdiv>WAVE: \u003cspan id=\"wave\">1\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"canvas-wrapper\">\n      \u003ccanvas id=\"spaceCanvas\" width=\"480\" height=\"420\">\u003c/canvas>\n      \u003cdiv id=\"overlay\" class=\"overlay\">\n        \u003ch2>SPACE DEFENDER\u003c/h2>\n        \u003cp>Defend the galaxy against invaders!\u003c/p>\n        \u003cbutton id=\"startBtn\">Launch\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"hint\">\u003cspan>&larr;\u003c/span> \u003cspan>&rarr;\u003c/span> / \u003cspan>A\u003c/span> \u003cspan>D\u003c/span> to Move | \u003cspan>SPACE\u003c/span> to Shoot\u003c/div>\n  \u003c/div>\n  \u003cscript>\nconst canvas = document.getElementById('spaceCanvas');\nconst ctx = canvas.getContext('2d');\nconst scoreEl = document.getElementById('score');\nconst livesEl = document.getElementById('lives');\nconst waveEl = document.getElementById('wave');\nconst overlay = document.getElementById('overlay');\nconst startBtn = document.getElementById('startBtn');\n\nlet player = {\n  x: canvas.width / 2 - 15,\n  y: canvas.height - 35,\n  w: 30,\n  h: 18,\n  speed: 6\n};\n\nlet bullets = [];\nlet enemyBullets = [];\nlet enemies = [];\nlet stars = [];\nlet score = 0;\nlet lives = 3;\nlet wave = 1;\nlet isPlaying = false;\nlet enemyDir = 1;\nlet enemyStepDown = false;\nlet lastShootTime = 0;\nlet enemySpeed = 1;\n\nconst keys = {};\n\nfunction initStars() {\n  stars = [];\n  for (let i = 0; i \u003c 60; i++) {\n    stars.push({\n      x: Math.random() * canvas.width,\n      y: Math.random() * canvas.height,\n      size: Math.random() * 2,\n      speed: 0.5 + Math.random() * 1.5\n    });\n  }\n}\n\nfunction initEnemies() {\n  enemies = [];\n  const rows = 4;\n  const cols = 8;\n  const startX = 40;\n  const startY = 40;\n  for (let r = 0; r \u003c rows; r++) {\n    for (let c = 0; c \u003c cols; c++) {\n      enemies.push({\n        x: startX + c * 45,\n        y: startY + r * 30,\n        w: 26,\n        h: 18,\n        color: r === 0 ? '#ef4444' : r === 1 ? '#f97316' : r === 2 ? '#eab308' : '#10b981',\n        points: (4 - r) * 10\n      });\n    }\n  }\n  enemySpeed = 0.8 + (wave - 1) * 0.3;\n  enemyDir = 1;\n}\n\nfunction updateLives() {\n  let h = '';\n  for (let i = 0; i \u003c lives; i++) h += '♥ ';\n  livesEl.textContent = h.trim();\n}\n\nfunction startGame() {\n  score = 0;\n  lives = 3;\n  wave = 1;\n  scoreEl.textContent = score;\n  waveEl.textContent = wave;\n  updateLives();\n  bullets = [];\n  enemyBullets = [];\n  initStars();\n  initEnemies();\n  player.x = canvas.width / 2 - player.w / 2;\n  overlay.classList.add('hidden');\n  isPlaying = true;\n  requestAnimationFrame(gameLoop);\n}\n\nfunction nextWave() {\n  wave++;\n  waveEl.textContent = wave;\n  bullets = [];\n  enemyBullets = [];\n  initEnemies();\n}\n\nfunction gameOver(won = false) {\n  isPlaying = false;\n  overlay.querySelector('h2').textContent = won ? 'GALAXY SAVED!' : 'MISSION FAILED';\n  overlay.querySelector('p').textContent = `Final Score: ${score} | Wave: ${wave}`;\n  startBtn.textContent = 'Play Again';\n  overlay.classList.remove('hidden');\n}\n\nfunction shoot() {\n  const now = performance.now();\n  if (now - lastShootTime > 250) {\n    bullets.push({\n      x: player.x + player.w / 2 - 2,\n      y: player.y,\n      w: 4,\n      h: 10,\n      speed: 8\n    });\n    lastShootTime = now;\n  }\n}\n\nfunction update() {\n  // Move player\n  if (keys['ArrowLeft'] || keys['a'] || keys['A']) {\n    player.x = Math.max(0, player.x - player.speed);\n  }\n  if (keys['ArrowRight'] || keys['d'] || keys['D']) {\n    player.x = Math.min(canvas.width - player.w, player.x + player.speed);\n  }\n  if (keys[' ']) {\n    shoot();\n  }\n\n  // Move stars\n  stars.forEach(s => {\n    s.y += s.speed;\n    if (s.y > canvas.height) s.y = 0;\n  });\n\n  // Move player bullets\n  bullets.forEach(b => b.y -= b.speed);\n  bullets = bullets.filter(b => b.y + b.h > 0);\n\n  // Move enemy bullets\n  enemyBullets.forEach(b => b.y += b.speed);\n  enemyBullets = enemyBullets.filter(b => b.y \u003c canvas.height);\n\n  // Move enemies\n  let hitWall = false;\n  enemies.forEach(e => {\n    e.x += enemySpeed * enemyDir;\n    if (e.x + e.w >= canvas.width - 10 || e.x \u003c= 10) {\n      hitWall = true;\n    }\n  });\n\n  if (hitWall) {\n    enemyDir *= -1;\n    enemies.forEach(e => {\n      e.y += 15;\n      if (e.y + e.h >= player.y) {\n        gameOver(false);\n      }\n    });\n  }\n\n  // Enemy shooting\n  if (Math.random() \u003c 0.03 && enemies.length > 0) {\n    const randomEnemy = enemies[Math.floor(Math.random() * enemies.length)];\n    enemyBullets.push({\n      x: randomEnemy.x + randomEnemy.w / 2 - 2,\n      y: randomEnemy.y + randomEnemy.h,\n      w: 4,\n      h: 8,\n      speed: 4\n    });\n  }\n\n  // Bullet-Enemy Collisions\n  for (let i = bullets.length - 1; i >= 0; i--) {\n    const b = bullets[i];\n    for (let j = enemies.length - 1; j >= 0; j--) {\n      const e = enemies[j];\n      if (\n        b.x \u003c e.x + e.w &&\n        b.x + b.w > e.x &&\n        b.y \u003c e.y + e.h &&\n        b.y + b.h > e.y\n      ) {\n        score += e.points;\n        scoreEl.textContent = score;\n        enemies.splice(j, 1);\n        bullets.splice(i, 1);\n        break;\n      }\n    }\n  }\n\n  // Player hit check\n  for (let i = enemyBullets.length - 1; i >= 0; i--) {\n    const eb = enemyBullets[i];\n    if (\n      eb.x \u003c player.x + player.w &&\n      eb.x + eb.w > player.x &&\n      eb.y \u003c player.y + player.h &&\n      eb.y + eb.h > player.y\n    ) {\n      enemyBullets.splice(i, 1);\n      lives--;\n      updateLives();\n      if (lives \u003c= 0) {\n        gameOver(false);\n        return;\n      }\n    }\n  }\n\n  if (enemies.length === 0) {\n    nextWave();\n  }\n}\n\nfunction draw() {\n  ctx.fillStyle = '#020617';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n\n  // Draw stars\n  ctx.fillStyle = '#94a3b8';\n  stars.forEach(s => {\n    ctx.fillRect(s.x, s.y, s.size, s.size);\n  });\n\n  // Draw player\n  ctx.fillStyle = '#38bdf8';\n  ctx.beginPath();\n  ctx.moveTo(player.x + player.w / 2, player.y);\n  ctx.lineTo(player.x + player.w, player.y + player.h);\n  ctx.lineTo(player.x, player.y + player.h);\n  ctx.closePath();\n  ctx.fill();\n\n  // Player bullets\n  ctx.fillStyle = '#34d399';\n  bullets.forEach(b => {\n    ctx.fillRect(b.x, b.y, b.w, b.h);\n  });\n\n  // Enemy bullets\n  ctx.fillStyle = '#f43f5e';\n  enemyBullets.forEach(eb => {\n    ctx.fillRect(eb.x, eb.y, eb.w, eb.h);\n  });\n\n  // Enemies\n  enemies.forEach(e => {\n    ctx.fillStyle = e.color;\n    ctx.fillRect(e.x, e.y, e.w, e.h);\n    // Alien eyes\n    ctx.fillStyle = '#020617';\n    ctx.fillRect(e.x + 5, e.y + 4, 4, 4);\n    ctx.fillRect(e.x + e.w - 9, e.y + 4, 4, 4);\n  });\n}\n\nfunction gameLoop() {\n  if (!isPlaying) return;\n  update();\n  draw();\n  requestAnimationFrame(gameLoop);\n}\n\nwindow.addEventListener('keydown', e => {\n  keys[e.key] = true;\n  if (!isPlaying && (e.key === ' ' || e.key === 'Enter')) {\n    startGame();\n  }\n});\n\nwindow.addEventListener('keyup', e => {\n  keys[e.key] = false;\n});\n\n// Touch control for Space Invaders: touch left side to move left, right side to move right, tap to shoot\ncanvas.addEventListener('touchstart', e => {\n  if (!isPlaying) {\n    startGame();\n    return;\n  }\n  if (e.touches.length > 0) {\n    const rect = canvas.getBoundingClientRect();\n    const touchX = e.touches[0].clientX - rect.left;\n    if (touchX \u003c rect.width * 0.4) {\n      keys['ArrowLeft'] = true;\n      keys['ArrowRight'] = false;\n    } else if (touchX > rect.width * 0.6) {\n      keys['ArrowRight'] = true;\n      keys['ArrowLeft'] = false;\n    } else {\n      keys[' '] = true;\n    }\n  }\n  e.preventDefault();\n}, { passive: false });\n\ncanvas.addEventListener('touchend', e => {\n  keys['ArrowLeft'] = false;\n  keys['ArrowRight'] = false;\n  keys[' '] = false;\n  e.preventDefault();\n}, { passive: false });\n\n// Mobile Gamepad PostMessage Listener\nwindow.addEventListener('message', e => {\n  if (e.data && e.data.type === 'arcade-key') {\n    const key = e.data.key;\n    const isDown = e.data.action === 'keydown';\n    keys[key] = isDown;\n    if (isDown && !isPlaying && (key === ' ' || key === 'Enter' || key === 'Start')) {\n      startGame();\n    }\n  }\n});\n\nstartBtn.addEventListener('click', startGame);\ninitStars();\ndraw();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};

      const filtered = GAMES_DATA.filter(g => {
        const matchesCat = currentCat === 'ALL' || g.category.toUpperCase() === currentCat.toUpperCase();
        const matchesSearch = g.title.toLowerCase().includes(searchQuery.toLowerCase()) || g.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8;">NO GAMES FOUND</div>';
        return;
      }

      filtered.forEach(g => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openGame(g.id, g.title);

        const bannerBg = g.id === 'snake' ? '#0d2818' : g.id === 'tetris' ? '#1e1b4b' : g.id === 'pong' ? '#082f49' : g.id === 'breakout' ? '#451a03' : g.id === '2048' ? '#4a044e' : g.id === 'flappy' ? '#365314' : g.id === 'runner' ? '#14532d' : '#3b0764';

        card.innerHTML = `
          <div class="card-banner" style="background:${bannerBg}">
            <span>${g.icon}</span>
            <span class="card-cat" style="color:${g.color}">${g.category.toUpperCase()}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${g.title}</div>
            <div class="card-desc">${g.desc}</div>
            <div class="play-btn">PLAY NOW &rarr;</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updateGamepadLabels(id) {
      const btnA = document.getElementById('gpBtnA');
      const btnB = document.getElementById('gpBtnB');
      const labelA = document.getElementById('gpLabelA');
      const labelB = document.getElementById('gpLabelB');
      if (!btnA || !btnB) return;

      if (id === 'tetris') {
        btnA.dataset.key = 'ArrowUp'; btnA.dataset.code = 'ArrowUp'; labelA.textContent = 'ROTATE';
        btnB.dataset.key = ' '; btnB.dataset.code = 'Space'; labelB.textContent = 'DROP';
      } else if (id === 'flappy') {
        btnA.dataset.key = ' '; btnA.dataset.code = 'Space'; labelA.textContent = 'FLAP';
        btnB.dataset.key = 'Enter'; btnB.dataset.code = 'Enter'; labelB.textContent = 'START';
      } else if (id === 'runner') {
        btnA.dataset.key = ' '; btnA.dataset.code = 'Space'; labelA.textContent = 'JUMP';
        btnB.dataset.key = 'ArrowDown'; btnB.dataset.code = 'ArrowDown'; labelB.textContent = 'DUCK';
      } else if (id === 'space-invaders') {
        btnA.dataset.key = ' '; btnA.dataset.code = 'Space'; labelA.textContent = 'FIRE';
        btnB.dataset.key = 'Enter'; btnB.dataset.code = 'Enter'; labelB.textContent = 'START';
      } else if (id === 'breakout' || id === 'pong') {
        btnA.dataset.key = ' '; btnA.dataset.code = 'Space'; labelA.textContent = 'LAUNCH';
        btnB.dataset.key = 'Enter'; btnB.dataset.code = 'Enter'; labelB.textContent = 'START';
      } else {
        btnA.dataset.key = ' '; btnA.dataset.code = 'Space'; labelA.textContent = 'ACTION';
        btnB.dataset.key = 'Enter'; btnB.dataset.code = 'Enter'; labelB.textContent = 'START';
      }
    }

    function sendKeyToGame(type, key, code) {
      try {
        const win = gameIframe.contentWindow;
        if (win) {
          const evt = new win.KeyboardEvent(type, { key: key, code: code || key, bubbles: true, cancelable: true });
          win.dispatchEvent(evt);
          if (win.document) win.document.dispatchEvent(evt);
        }
      } catch (err) {}
      try {
        gameIframe.contentWindow.postMessage({ type: 'arcade-key', action: type, key: key, code: code || key }, '*');
      } catch (err) {}
    }

    // Key repeat handler for D-Pad
    let keyIntervals = {};
    function startKey(key, code) {
      try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
      sendKeyToGame('keydown', key, code);
      if (!keyIntervals[key]) {
        keyIntervals[key] = setInterval(() => sendKeyToGame('keydown', key, code), 75);
      }
    }
    function stopKey(key, code) {
      if (keyIntervals[key]) {
        clearInterval(keyIntervals[key]);
        delete keyIntervals[key];
      }
      sendKeyToGame('keyup', key, code);
    }

    function openGame(id, title) {
      activeGameId = id;
      activeGameTitle.textContent = title.toUpperCase();
      updateGamepadLabels(id);
      const htmlContent = GAMES_HTML[id];
      if (htmlContent) {
        gameIframe.srcdoc = htmlContent;
        arcadeScreen.style.display = 'none';
        gameScreen.style.display = 'flex';
      }
    }

    function closeGame() {
      gameIframe.srcdoc = 'about:blank';
      gameScreen.style.display = 'none';
      arcadeScreen.style.display = 'block';
      activeGameId = null;
    }

    function restartGame() {
      if (activeGameId && GAMES_HTML[activeGameId]) {
        gameIframe.srcdoc = GAMES_HTML[activeGameId];
      }
    }

    function openFullTab() {
      try {
        const w = window.open('', '_blank');
        if (w) {
          w.document.open();
          w.document.write('<!DOCTYPE html>' + document.documentElement.outerHTML);
          w.document.close();
          return;
        }
      } catch (err) {}
      alert("Tip: In Google Sites, drag the blue corner handles on this embed box to make it fill your screen!");
    }

    function toggleFullscreen(targetEl) {
      const el = targetEl || document.documentElement;
      const canFullscreen = document.fullscreenEnabled || document.webkitFullscreenEnabled;
      
      if (canFullscreen) {
        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            let p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
            if (p && p.catch) {
              p.catch(() => openFullTab());
              return;
            }
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
            return;
          }
        } catch (e) {
          openFullTab();
          return;
        }
      }
      openFullTab();
    }

    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value;
      renderGames();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.getAttribute('data-cat');
        renderGames();
      });
    });

    backBtn.addEventListener('click', closeGame);
    restartBtn.addEventListener('click', restartGame);
    fullscreenBtn.addEventListener('click', () => toggleFullscreen(document.getElementById('frameWrapper')));
    if (arcadeFullscreenBtn) {
      arcadeFullscreenBtn.addEventListener('click', () => toggleFullscreen(document.documentElement));
    }

    // Touch Gamepad Event Listeners
    const touchGamepad = document.getElementById('touchGamepad');
    const toggleGamepadBtn = document.getElementById('toggleGamepadBtn');
    let isGamepadVisible = true;

    if (toggleGamepadBtn && touchGamepad) {
      toggleGamepadBtn.addEventListener('click', () => {
        isGamepadVisible = !isGamepadVisible;
        touchGamepad.style.display = isGamepadVisible ? 'flex' : 'none';
        toggleGamepadBtn.textContent = isGamepadVisible ? '📱 PAD: ON' : '📱 PAD: OFF';
      });
    }

    // D-Pad buttons
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const key = btn.dataset.key;
      const code = btn.dataset.code;
      btn.addEventListener('pointerdown', e => { e.preventDefault(); startKey(key, code); });
      btn.addEventListener('pointerup', e => { e.preventDefault(); stopKey(key, code); });
      btn.addEventListener('pointerleave', e => { e.preventDefault(); stopKey(key, code); });
      btn.addEventListener('pointercancel', e => { e.preventDefault(); stopKey(key, code); });
    });

    // Action buttons (A & B)
    const btnA = document.getElementById('gpBtnA');
    const btnB = document.getElementById('gpBtnB');
    if (btnA) {
      btnA.addEventListener('pointerdown', e => { e.preventDefault(); startKey(btnA.dataset.key, btnA.dataset.code); });
      btnA.addEventListener('pointerup', e => { e.preventDefault(); stopKey(btnA.dataset.key, btnA.dataset.code); });
      btnA.addEventListener('pointerleave', e => { e.preventDefault(); stopKey(btnA.dataset.key, btnA.dataset.code); });
      btnA.addEventListener('pointercancel', e => { e.preventDefault(); stopKey(btnA.dataset.key, btnA.dataset.code); });
    }
    if (btnB) {
      btnB.addEventListener('pointerdown', e => { e.preventDefault(); startKey(btnB.dataset.key, btnB.dataset.code); });
      btnB.addEventListener('pointerup', e => { e.preventDefault(); stopKey(btnB.dataset.key, btnB.dataset.code); });
      btnB.addEventListener('pointerleave', e => { e.preventDefault(); stopKey(btnB.dataset.key, btnB.dataset.code); });
      btnB.addEventListener('pointercancel', e => { e.preventDefault(); stopKey(btnB.dataset.key, btnB.dataset.code); });
    }

    // System buttons
    const gpStartBtn = document.getElementById('gpStartBtn');
    const gpResetBtn = document.getElementById('gpResetBtn');
    if (gpStartBtn) {
      gpStartBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) {}
        sendKeyToGame('keydown', 'Enter', 'Enter');
        sendKeyToGame('keydown', ' ', 'Space');
      });
      gpStartBtn.addEventListener('pointerup', e => {
        e.preventDefault();
        sendKeyToGame('keyup', 'Enter', 'Enter');
        sendKeyToGame('keyup', ' ', 'Space');
      });
    }
    if (gpResetBtn) {
      gpResetBtn.addEventListener('click', () => {
        try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) {}
        restartGame();
      });
    }

    renderGames();
  </script>
</body>
</html>
